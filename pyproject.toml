[project]
name = "String-Analysis-Application"
version = "0.1.0"
description = "String Analysis Application"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.uv.workspace]
members = [
    "backend",
]


